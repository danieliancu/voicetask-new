{% load icons %}
{# Cele patru destinatii sunt fixe. „Modifică" si „Șterge" sunt pagini secundare. #}
<nav class="bottom-nav" aria-label="Navigație principală">
  <a class="bottom-nav__item" href="{% url 'core:home' %}"
     {% if page == "home" %}aria-current="page"{% endif %}>
    {% icon "home" 24 %}<span>Acasă</span>
  </a>
  <a class="bottom-nav__item" href="{% url 'notes:list' %}"
     {% if page == "notes" %}aria-current="page"{% endif %}>
    {% icon "note" 24 %}<span>Notițe</span>
  </a>
  <a class="bottom-nav__item" href="{% url 'scheduling:calendar' %}"
     {% if page == "scheduling" %}aria-current="page"{% endif %}>
    {% icon "calendar" 24 %}<span>Programări</span>
  </a>
  <a class="bottom-nav__item" href="{% url 'search:index' %}"
     {% if page == "search" %}aria-current="page"{% endif %}>
    {% icon "search" 24 %}<span>Caută</span>
  </a>
</nav>
