{% load icons %}
{% if error %}
  <li class="message message--error">{% icon "alert" 16 %}<span>{{ error }}</span></li>
{% else %}
  <li class="card card--tabless card--flat">
    <div class="card__body" style="flex-direction:column;align-items:stretch;gap:var(--space-2)">
      <strong class="text-sm">{% icon "search" 14 %} {{ item.question }}</strong>
      <p class="text-sm muted">{{ item.answer }}</p>
    </div>
  </li>
{% endif %}
